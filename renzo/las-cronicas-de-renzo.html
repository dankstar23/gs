<!DOCTYPE html>
<html lang="es">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<style>
html,body{margin:0;height:100%;background:#07050b;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#c{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;outline:none}

#pad{position:absolute;left:16px;bottom:16px;width:136px;height:136px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.22);pointer-events:auto;touch-action:none}

.btn.on{background:rgba(255,255,255,.32)}
#bx{right:16px;bottom:58px}

<div id="tc">

  <div class="btn" id="bx">X<small>GOLPE</small></div>
  <div class="btn" id="bc">C<small>ESPECIAL</small></div>

<script>
'use strict';
/* =====================================================================
   LAS CRÓNICAS DE RENZO
   Beat 'em up de desplazamiento lateral, 320x180, pixel art y chiptune
   generados por código (Canvas 2D + Web Audio API). Un solo archivo.
   ===================================================================== */

// ------------------------------------------------------------- núcleo
const W = 320, H = 180, GROUND = 160;
const GRAV = 0.32, MAXFALL = 7, JUMP_V = -6.0;
const cv = document.getElementById('c');
const g = cv.getContext('2d', { alpha: false });
g.imageSmoothingEnabled = false;

function fitCanvas() {
  const ww = window.innerWidth, wh = window.innerHeight;
  let s = Math.min(ww / W, wh / H);
  if (s >= 2) s = Math.floor(s);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const choose = (arr) => arr[Math.floor(Math.random() * arr.length)];
const sgn = (v) => (v < 0 ? -1 : 1);
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  return [c, x];
}
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

// ------------------------------------------------------------- paleta limitada (69 colores)
const P = {
  k0: '#0d0a12', k1: '#1b1726', k2: '#2b2638', k3: '#3e3850', k4: '#57516b', k5: '#767089', k6: '#9a95a8', k7: '#c1bdc9', k8: '#e2dfe6', k9: '#ffffff',
  s0: '#f6d2b0', s1: '#e8b48c', s2: '#d0966b', s3: '#b37650', s4: '#8a5535', s5: '#6a3c24', s6: '#4e2a18', s7: '#341b0f',
  r0: '#3b0d1b', r1: '#6b1626', r2: '#a3222c', r3: '#d63c35', r4: '#f2715a', r5: '#ffa98c',
  o0: '#5c2a0c', o1: '#99460f', o2: '#d6701c', o3: '#f29b2e', y0: '#f7c443', y1: '#fbe27a', y2: '#fff4c2',
  g0: '#0e2418', g1: '#1a4026', g2: '#2b6b34', g3: '#4a9b42', g4: '#8ccd5c', g5: '#c8ef8e',
  c0: '#0b2a35', c1: '#13505f', c2: '#1f8291', c3: '#3fbcc2', c4: '#8de6df', c5: '#d2fbf4',
  b0: '#0c1236', b1: '#17266b', b2: '#2541a8', b3: '#3f6fdc', b4: '#7aa5f2', b5: '#bcd5fb',
  p0: '#1f0d33', p1: '#3b175c', p2: '#62268a', p3: '#9140b8', p4: '#c374db', p5: '#ecb5f2',
  m0: '#5e1638', m1: '#9e2a5c', m2: '#d84f86', m3: '#f58fb4',
  n0: '#24150d', n1: '#3e2516', n2: '#5f3a21', n3: '#86552f', n4: '#ad7a49', n5: '#d6a86f',
  d0: '#9c7a45', d1: '#c9a462', d2: '#e3c486', d3: '#f2deaa',
};
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

// ------------------------------------------------------------- primitivas pixel-perfect
function rect(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function px(c, x, y, col) { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), 1, 1); }
function hline(c, x, y, w, col) { rect(c, x, y, w, 1, col); }
function vline(c, x, y, h, col) { rect(c, x, y, 1, h, col); }
function dither(c, x, y, w, h, col, ph = 0) {
  c.fillStyle = col; x = Math.round(x); y = Math.round(y);
  for (let j = 0; j < h; j++) for (let i = (j + ph) & 1; i < w; i += 2) c.fillRect(x + i, y + j, 1, 1);
}
function dither4(c, x, y, w, h, col, ph = 0) { // 25% de cobertura
  c.fillStyle = col; x = Math.round(x); y = Math.round(y);
  for (let j = 0; j < h; j++) if (((j + ph) & 1) === 0) for (let i = ((j + ph) >> 1) & 1 ? 2 : 0; i < w; i += 4) c.fillRect(x + i, y + j, 1, 1);
}
function circ(c, cx, cy, r, col) {
  c.fillStyle = col; cx = Math.round(cx); cy = Math.round(cy);
  for (let dy = -r; dy <= r; dy++) { const dx = Math.floor(Math.sqrt(r * r - dy * dy + r * 0.6)); c.fillRect(cx - dx, cy + dy, dx * 2 + 1, 1); }
}
function ellipse(c, cx, cy, rx, ry, col) {
  c.fillStyle = col; cx = Math.round(cx); cy = Math.round(cy);
  for (let dy = -ry; dy <= ry; dy++) {
    const dx = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry + 0.6))));
    c.fillRect(cx - dx, cy + dy, dx * 2 + 1, 1);
  }
}
function fillPoly(c, pts, col) {
  c.fillStyle = col;
  let minY = Infinity, maxY = -Infinity;
  for (const p of pts) { minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); }
  minY = Math.floor(minY); maxY = Math.ceil(maxY);
  for (let y = minY; y <= maxY; y++) {
    const yc = y + 0.5, xs = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc)) xs.push(a[0] + ((yc - a[1]) / (b[1] - a[1])) * (b[0] - a[0]));
    }
    xs.sort((p, q) => p - q);
    for (let i = 0; i + 1 < xs.length; i += 2) {
      const x0 = Math.round(xs[i]), x1 = Math.round(xs[i + 1]);
      if (x1 > x0) c.fillRect(x0, y, x1 - x0, 1);
    }
  }
}
// línea gruesa con pincel cuadrado (Bresenham)
function limb(c, a, b, t, col) {
  let x0 = Math.round(a[0]), y0 = Math.round(a[1]); const x1 = Math.round(b[0]), y1 = Math.round(b[1]);
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy; const o = Math.floor(t / 2);
  c.fillStyle = col;
  for (let n = 0; n < 400; n++) {
    c.fillRect(x0 - o, y0 - o, t, t);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x0 += sx; }
    if (e2 < dx) { err += dx; y0 += sy; }
  }
}
// gradiente vertical por bandas con transición tramada
function bands(c, x, y, w, h, cols) {
  const n = cols.length, bh = h / n;
  for (let i = 0; i < n; i++) {
    const y0 = Math.round(y + i * bh), y1 = Math.round(y + (i + 1) * bh);
    rect(c, x, y0, w, y1 - y0, cols[i]);
    if (i > 0) { dither(c, x, y0, w, 2, cols[i - 1], 0); dither4(c, x, y0 + 2, w, 2, cols[i - 1], 0); }
  }
}
// contorno oscuro de 1px alrededor de lo pintado (look de sprite SNES)
function outline(cnv, col = P.k0) {
  const x = cnv.getContext('2d'); const w = cnv.width, h = cnv.height;
  const id = x.getImageData(0, 0, w, h); const d = id.data;
  const [r, gg, b] = hexRgb(col);
  const a = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) a[i] = d[i * 4 + 3] > 0 ? 1 : 0;
  for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) {
    const i = yy * w + xx; if (a[i]) continue;
    if ((xx > 0 && a[i - 1]) || (xx < w - 1 && a[i + 1]) || (yy > 0 && a[i - w]) || (yy < h - 1 && a[i + w])) {
      d[i * 4] = r; d[i * 4 + 1] = gg; d[i * 4 + 2] = b; d[i * 4 + 3] = 255;
    }
  }
  x.putImageData(id, 0, 0);
}
// versión plana (silueta) de un canvas: para destellos de golpe
function silhouette(src, col) {
  const [c, x] = mkCanvas(src.width, src.height);
  x.drawImage(src, 0, 0); x.globalCompositeOperation = 'source-atop'; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height);
  return c;
}
// dibuja un canvas volteado horizontalmente (pixel-perfect)
function blit(ctx, img, x, y, flip) {
  x = Math.round(x); y = Math.round(y);
  if (!flip) { ctx.drawImage(img, x, y); return; }
  ctx.save(); ctx.translate(x + img.width, y); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0); ctx.restore();
}

// ------------------------------------------------------------- entrada (teclado, mando, táctil)
const KEYMAP = {
  ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
  KeyA: 'left', KeyD: 'right', KeyW: 'up', KeyS: 'down',
  KeyZ: 'jump', Space: 'jump', KeyK: 'jump',
  KeyX: 'attack', KeyJ: 'attack',
  KeyC: 'special', KeyL: 'special',
  Enter: 'start', NumpadEnter: 'start', Escape: 'pause', KeyP: 'pause', KeyM: 'mute',
};
const ACTIONS = ['left', 'right', 'up', 'down', 'jump', 'attack', 'special', 'start', 'pause', 'mute'];
const Input = {
  key: {}, touch: {}, pad: {}, prevPad: {}, held: {}, pressed: {}, queue: new Set(),
  poll() {
    this.pollPad();
    for (const a of ACTIONS) {
      this.held[a] = !!(this.key[a] || this.touch[a] || this.pad[a]);
      this.pressed[a] = this.queue.has(a);
    }
    this.queue.clear();
  },
  pollPad() {
    let pads = [];
    try { pads = navigator.getGamepads ? Array.from(navigator.getGamepads()) : []; } catch (e) { pads = []; }
    const p = pads.find((q) => q && q.connected);
    const now = {};
    if (p) {
      const b = (i) => !!(p.buttons[i] && p.buttons[i].pressed);
      const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
      now.left = b(14) || ax < -0.45; now.right = b(15) || ax > 0.45;
      now.up = b(12) || ay < -0.55; now.down = b(13) || ay > 0.55;
      now.jump = b(0); now.attack = b(2) || b(1); now.special = b(3) || b(5) || b(4); now.start = b(9);
      for (const a in now) if (now[a] && !this.prevPad[a]) { this.queue.add(a); AU.unlock(); }
    }
    this.pad = now; this.prevPad = now;
  },
  // ¿se pulsó alguna tecla de "confirmar"?
  ok() { return this.pressed.attack || this.pressed.jump || this.pressed.start; },
};
window.addEventListener('keydown', (e) => {
  AU.unlock();
  const a = KEYMAP[e.code];
  if (!a) return;
  e.preventDefault();
  if (!e.repeat) { Input.key[a] = true; Input.queue.add(a); }
});
window.addEventListener('keyup', (e) => { const a = KEYMAP[e.code]; if (a) { Input.key[a] = false; e.preventDefault(); } });
window.addEventListener('blur', () => { Input.key = {}; Input.touch = {}; });
cv.addEventListener('pointerdown', () => { AU.unlock(); Input.queue.add('start'); cv.focus(); });

function setupTouch() {
  const tc = document.getElementById('tc');
  const show = () => tc.classList.add('on');
  if ('ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0) show();
  window.addEventListener('touchstart', () => { show(); AU.unlock(); }, { passive: true });
  const pad = document.getElementById('pad');
  let padId = null;
  const t = Input.touch;
  const padSet = (e) => {
    const r = pad.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const dead = r.width * 0.13;
    const L = dx < -dead, Rr = dx > dead, U = dy < -dead * 1.5, D = dy > dead * 1.5;
    if (L && !t.left) Input.queue.add('left');
    if (Rr && !t.right) Input.queue.add('right');
    if (U && !t.up) Input.queue.add('up');
    if (D && !t.down) Input.queue.add('down');
    t.left = L; t.right = Rr; t.up = U; t.down = D;
  };
  pad.addEventListener('pointerdown', (e) => { e.preventDefault(); padId = e.pointerId; try { pad.setPointerCapture(e.pointerId); } catch (_) {} padSet(e); AU.unlock(); });
  pad.addEventListener('pointermove', (e) => { if (e.pointerId === padId) padSet(e); });
  const padUp = (e) => { if (e.pointerId === padId) { padId = null; t.left = t.right = t.up = t.down = false; } };
  pad.addEventListener('pointerup', padUp); pad.addEventListener('pointercancel', padUp);
  const bind = (id, a) => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault(); e.stopPropagation();
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      t[a] = true; Input.queue.add(a); el.classList.add('on'); AU.unlock();
    });
    const up = () => { t[a] = false; el.classList.remove('on'); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  };
  bind('bz', 'jump'); bind('bx', 'attack'); bind('bc', 'special'); bind('bs', 'start');
}

// ------------------------------------------------------------- guardado (opcional)
const Save = {
  get() { try { return JSON.parse(localStorage.getItem('renzo_cronicas') || '{}') || {}; } catch (e) { return {}; } },
  set(o) { try { localStorage.setItem('renzo_cronicas', JSON.stringify(Object.assign(this.get(), o))); } catch (e) { /* sin almacenamiento */ } },
};

// ------------------------------------------------------------- dibujo de una figura
function drawHead(c, S, cx, cy, mood) {
  const hw = S.hw || 8, hh = S.hh || 9;
  const x0 = Math.round(cx - hw / 2), y0 = Math.round(cy - hh / 2);
  const sk = S.skin, sd = S.skinD;
  // base del cráneo y cara (mirando a la derecha)
  rect(c, x0 + 1, y0, hw - 2, 1, sk);
  rect(c, x0, y0 + 1, hw, hh - 3, sk);
  rect(c, x0 + 1, y0 + hh - 2, hw - 1, 1, sk);
  rect(c, x0 + 2, y0 + hh - 1, hw - 3, 1, sk);
  px(c, x0 + hw, y0 + Math.floor(hh * 0.45), sk); // nariz
  // sombra de mandíbula y nuca
  rect(c, x0, y0 + hh - 4, 1, 2, sd); rect(c, x0 + 1, y0 + hh - 2, 2, 1, sd);
  const ey = y0 + Math.floor(hh * 0.33);
  const ex = x0 + hw - 3;
  // ojos
  if (S.ghostEye) { rect(c, ex - 1, ey, 2, 2, P.c4); px(c, ex, ey, P.k9); }
  else if (S.hypno) { rect(c, ex - 1, ey, 2, 2, P.p4); px(c, ex, ey + 1, P.k9); }
  else if (mood === 'hurt') { px(c, ex - 1, ey, S.eye); px(c, ex, ey + 1, S.eye); px(c, ex + 1, ey, S.eye); }
  else if (S.bigEye) { rect(c, ex - 1, ey, 2, 2, P.k9); rect(c, ex, ey, 1, 2, S.eye); }
  else { rect(c, ex, ey, 1, 2, S.eye); px(c, ex + 1, ey, P.k8); }
  // cejas
  if (!S.hypno && !S.ghostEye) {
    if (S.mouth === 'grit' || S.mouth === 'grin' || mood === 'angry') { px(c, ex - 1, ey - 2, S.brow); px(c, ex, ey - 1, S.brow); px(c, ex + 1, ey - 1, S.brow); }
    else hline(c, ex - 1, ey - 1, 3, S.brow);
  }
  // oreja
  rect(c, x0 + 2, y0 + Math.floor(hh * 0.45), 1, 2, sd);
  // boca
  const my = y0 + hh - 3, mx = x0 + hw - 3;
  const m = mood === 'hurt' ? 'open' : S.mouth;
  if (m === 'smile') { hline(c, mx - 1, my, 3, P.k9); px(c, mx - 2, my - 1, P.r1); px(c, mx + 2, my - 1, P.r1); hline(c, mx - 1, my + 1, 3, P.r1); }
  else if (m === 'grin') { hline(c, mx - 1, my, 3, P.k9); hline(c, mx - 1, my + 1, 2, P.r1); }
  else if (m === 'grit') { hline(c, mx - 1, my, 3, P.k9); px(c, mx, my, P.k3); }
  else if (m === 'smirk') { hline(c, mx - 1, my, 2, P.r1); px(c, mx + 1, my - 1, P.r1); }
  else if (m === 'open') { rect(c, mx, my - 1, 2, 2, P.r0); }
  else if (m === 'line') hline(c, mx, my, 2, S.skinD === P.s6 ? P.s7 : P.r1);
  // pelo / sombreros
  drawHair(c, S, x0, y0, hw, hh);
  // accesorios
  for (const a of S.acc) {
    if (a === 'shades') { rect(c, ex - 2, ey, 5, 2, P.k0); px(c, ex + 1, ey, P.k5); hline(c, x0 + 2, ey, ex - x0 - 3, P.k0); }
    if (a === 'glasses') { rect(c, ex - 1, ey - 1, 3, 3, P.k0); px(c, ex, ey, P.b5); hline(c, x0 + 2, ey, ex - x0 - 2, P.k0); }
    if (a === 'monocle') { rect(c, ex - 1, ey - 1, 3, 3, P.y0); rect(c, ex, ey, 1, 1, P.b5); vline(c, ex - 1, ey + 2, 3, P.y0); }
    if (a === 'walrus') { rect(c, mx - 2, my - 2, 5, 2, S.hairC); px(c, mx + 3, my - 1, S.hairC); }
    if (a === 'handlebar') { hline(c, mx - 2, my - 2, 5, P.k1); px(c, mx - 3, my - 3, P.k1); px(c, mx + 3, my - 3, P.k1); px(c, mx - 3, my - 4, P.k1); px(c, mx + 3, my - 4, P.k1); }
    if (a === 'stubble') { dither(c, mx - 2, my - 1, 4, 3, S.skinD); }
    if (a === 'freckles') { px(c, ex - 1, ey + 2, P.o2); px(c, ex + 1, ey + 2, P.o2); }
    if (a === 'beard') { rect(c, x0 + 3, my - 1, hw - 3, 3, S.hairC); rect(c, x0 + 4, my + 2, hw - 5, 2, S.hairC); hline(c, mx - 1, my, 2, P.r1); }
  }
}

let TV_OVERLAY = null;
function tvOverlay() {
  if (TV_OVERLAY) return TV_OVERLAY;
  const [c, x] = mkCanvas(W, H);
  x.fillStyle = 'rgba(0,0,0,0.13)'; for (let y = 0; y < H; y += 2) x.fillRect(0, y, W, 1);
  const R = 16; x.fillStyle = '#000';
  for (let y = 0; y < R; y++) {
    const dx = Math.ceil(R - Math.sqrt(R * R - (R - y) * (R - y)));
    x.fillRect(0, y, dx, 1); x.fillRect(W - dx, y, dx, 1); x.fillRect(0, H - 1 - y, dx, 1); x.fillRect(W - dx, H - 1 - y, dx, 1);
  }
  x.fillStyle = 'rgba(0,0,0,0.2)'; x.fillRect(0, 0, W, 3); x.fillRect(0, H - 3, W, 3); x.fillRect(0, 0, 3, H); x.fillRect(W - 3, 0, 3, H);
  return (TV_OVERLAY = c);
}

  const b2 = c.createBiquadFilter(); b2.type = 'bandpass'; b2.frequency.value = 1250; b2.Q.value = 3;
  const gn = c.createGain(); gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(vol, t + 0.015); gn.gain.exponentialRampToValueAtTime(0.0008, t + 0.11);
  o.connect(b1); o.connect(b2); b1.connect(gn); b2.connect(gn); gn.connect(d); o.start(t); o.stop(t + 0.13);
  noiseHit(t, d, 0.04, vol * 0.7, 'bandpass', 1800, 1.5);
}

class Pichincha extends Boss {
  constructor(x) { super('pichincha', 'EL PICHINCHA', x, 440); this.hw = 12; this.hh = 54; this.score = 12000; this.commercialDone = false; this.shadowS = 1.3; }
  hittable() { return super.hittable() && !['away', 'season', 'commercial'].includes(this.state) && !(this.state === 'channel' && this.t < 16); }
  update() {
    if (this.hitstop > 0) { this.hitstop--; return; }
    if (!this.common()) this.brain();
    if (this.state !== 'away') this.physics();
    if (!['intro', 'away', 'return'].includes(this.state)) this.clampArena();
    if (this.phase === 1 && this.hp < this.maxHp / 2 && this.isIdleish()) { this.state = 'season'; this.t = 0; this.vx = 0; }
  }
  brain() {
    const p = G.player, dx = p.x - this.x, adx = Math.abs(dx), ph2 = this.phase === 2;
    switch (this.state) {
      case 'intro': this.anim = 'walk'; this.at += 0.08; this.vx = -0.8; if (this.x < G.lockR - 70) { this.vx = 0; this.state = 'idle'; this.cool = 40; } break;
      case 'idle': {
        this.face2p(); this.anim = 'idle'; this.at += 0.04;
        this.vx = adx > 110 ? this.face * 0.8 : adx < 40 ? -this.face * 0.7 : 0; if (this.vx) { this.anim = 'walk'; this.at += 0.08; }
        if (this.cool > 0) break;
        if (!this.commercialDone && this.hp < this.maxHp * 0.72) { this.state = 'commercial'; this.t = 0; this.vx = 0; break; }
        const r = Math.random();
        if (adx < 40) this.state = r < 0.55 ? 'cane' : 'channel';
        else this.state = r < 0.34 ? 'pies' : r < 0.68 ? 'laughs' : r < 0.84 ? 'channel' : (ph2 ? 'lights' : 'pies');
        if (ph2 && this.state === 'pies' && Math.random() < 0.4) this.state = 'lights';
        this.t = 0; this.vx = 0; break;
      }
      case 'cane': this.vx = 0; this.anim = this.t < 14 ? 'throw0' : 'throw1';
        if (this.t === 14) { SFX.play('swing'); this.vx = this.face * 1.4; }
        if (this.t >= 14 && this.t <= 20) this.hitP(this.frontBox(34, -56, 48), 11, true);
        if (this.t > 30) { this.state = 'recover'; this.t = 0; } break;
      case 'pies': {
        this.vx = 0; this.anim = this.t % 18 < 9 ? 'throw0' : 'throw1'; this.face2p();
        if ([9, 27, 45].includes(this.t) || (ph2 && this.t === 63)) {
          SFX.play('throw');
          const sx = this.x + this.face * 10, sy = this.y - 44, tdx = p.x - sx, tdy = p.y - 18 - sy, Tt = clamp(Math.abs(tdx) / 2.6, 22, 48);
          G.projs.push(new Proj('pastel', sx, sy, tdx / Tt, (tdy - 0.1 * Tt * Tt) / Tt, { dmg: 10 }));
        }
        if (this.t > (ph2 ? 76 : 58)) { this.state = 'recover'; this.t = 0; } break;
      }
      case 'laughs':
        this.vx = 0; this.anim = 'cast'; this.face2p();
        if (this.t === 1) { lineSfx('laugh'); }
        if ([12, 30, 48].includes(this.t) || (ph2 && this.t === 66)) {
          const k = [12, 30, 48, 66].indexOf(this.t), y = k % 2 === 0 ? GROUND - 6 : GROUND - 48;
          G.projs.push(new Proj('ja', this.x + this.face * 16, y, this.face * (ph2 ? 2.8 : 2.3), 0, { dmg: 8, life: 220 }));
          SFX.play('boing');
        }
        if (this.t > (ph2 ? 86 : 68)) { this.state = 'recover'; this.t = 0; } break;
      case 'channel':
        this.vx = 0; this.anim = 'cast';
        if (this.t === 1) { SFX.play('tvstatic'); G.static = 22; popText(this.x, this.y - 70, '¡CAMBIO DE CANAL!', P.k9); }
        if (this.t === 16) { this.x = clamp(p.x - p.face * 34, G.lockL + 20, G.lockR - 20); this.face2p(); this.state = 'cane'; this.t = 5; }
        break;
      case 'lights':
        this.vx = 0; this.anim = 'cast';
        if (this.t === 1) lineSfx('applause');
        if (this.t >= 16 && this.t <= 64 && this.t % 12 === 4) {
          const mx = clamp(p.x + rnd(-60, 60), G.lockL + 12, G.lockR - 12);
          G.projs.push(new Proj('foco', mx, -12, 0, 1.0, { dmg: 12, knock: 1, life: 260 }));
          G.parts.push({ k: 'ring', x: mx, y: surfaceBelow(mx, -12) - 1, col: P.k9, r0: 11, r1: 3, t: 0, max: 40 });
        }
        if (this.t > 100) { this.state = 'recover'; this.t = 0; } break;
      case 'commercial':
        this.vx = 0; this.anim = 'cast';
        if (this.t === 1) { popText(this.x, this.y - 70, '¡CORTE COMERCIAL!', P.y1); SFX.play('rimshot'); }
        if (this.t === 30) { G.static = 18; SFX.play('tvstatic'); this.commercialDone = true; this.state = 'away'; this.t = 0; Play.spawn('vendedor', 'L'); Play.spawn('lechero', 'R'); Play.spawn('vecino', 'R'); }
        break;
      case 'away':
        this.x = G.lockR + 60; this.vx = 0;
        if (this.t > 60 && !G.ents.some((e) => e.isEnemy && !e.isBoss && !e.remove)) { this.state = 'return'; this.t = 0; this.x = G.lockR + 30; this.y = GROUND; lineSfx('applause'); }
        break;
      case 'return': this.anim = 'walk'; this.at += 0.08; this.vx = -0.9; if (this.x < G.lockR - 60) { this.vx = 0; this.state = 'idle'; this.cool = 30; } break;
      case 'season':
        this.vx = 0; this.anim = 'cast'; this.invuln = 5;
        if (this.t === 1) Play.say([{ who: 'pichincha', t: '¡Cambio de canal! ¡Ahora viene lo mejor del programa!' }]);
        if (this.t === 2) { G.static = 30; SFX.play('tvstatic'); }
        if (this.t > 40) { this.phase = 2; this.cmul = 0.7; lineSfx('applause'); this.state = 'idle'; this.cool = 30; }
        break;
      case 'recover': this.anim = 'idle'; this.vx = 0; if (this.t > 26 * this.cmul) { this.state = 'idle'; this.cool = 30 * this.cmul; } break;
    }
  }
  draw(ctx, cam) {
    if (this.state === 'away') return;
    if (this.state === 'channel' && this.t < 16 && this.t % 4 < 2) return;
    const tint = this.state === 'cane' && this.t < 14 && this.t % 6 < 3 ? P.k9 : null;
    this.drawRig(ctx, cam, 'pichincha', { tint });
  }
}

function parseWave(w) {
  let last = -40;
  const list = w.list.trim().split(/\s+/).map((tok) => {
    const m = /^(\w+):([LRT])(?:@(\d+))?$/.exec(tok);
    const at = m[3] != null ? parseInt(m[3], 10) : last + 40; last = at;
    return { type: m[1], side: m[2], at, done: false };
  });
  return { x: w.x, max: w.max || 4, list, t: 0, started: false, done: false };
}

    const sx = G.shake ? rndi(-2, 2) : 0, sy = G.shake ? rndi(-1, 1) : 0;
    const cam = Math.round(G.cam);
    ctx.save(); ctx.translate(sx, sy);
    drawStageBack(ctx, G.art, cam, G.t, G.st);
    for (const b of G.brks) b.draw(ctx, cam);
    for (const it of G.items) it.draw(ctx, cam);
    if (G.npc && G.npc.x - cam > -30 && G.npc.x - cam < W + 30) { const n = G.npc; ctx.globalAlpha = 0.45; ellipse(ctx, Math.round(n.x - cam), GROUND - 1, 9, 2, P.k0); ctx.globalAlpha = 1; drawChar(ctx, 'irma', 'stand', G.t * 0.03, n.x - cam, n.y, n.face); }
    const actors = [G.player].concat(G.ents);
    for (const a of actors) if (a.state !== 'dead' && !(a.isBoss && a.phase === 3) && a.alpha !== 0) a.shadow(ctx, cam);
    actors.sort((a, b) => a.y - b.y);
    for (const a of actors) a.draw(ctx, cam);
    for (const pr of G.projs) pr.draw(ctx, cam);
    drawParts(ctx, cam);
    if (G.npc && G.npc.near && !G.dialog) { const bob = Math.round(Math.sin(G.t * 0.15)); text(ctx, '▲ PISTA', G.npc.x - cam, G.npc.y - 52 + bob, G.t % 30 < 20 ? P.y1 : P.k9, P.k0, 'c'); }
    if (G.art.T.fg) G.art.T.fg(ctx, cam, G.t);
    ctx.restore();
    if (G.flash > 0) { ctx.globalAlpha = Math.min(0.8, G.flash / 10); rect(ctx, 0, 0, W, H, P.k9); ctx.globalAlpha = 1; }
    this.drawHUD(ctx);
    if (this.banner.t > 0 && this.banner.t < 130) { const y = 40; rect(ctx, 0, y - 3, W, 15, P.k0); hline(ctx, 0, y - 3, W, P.y0); hline(ctx, 0, y + 11, W, P.y0); text(ctx, this.banner.s, 160, y, P.k9, null, 'c'); }
    if (this.goT > 0) { this.goT--; if (this.goT % 40 < 26) text(ctx, '¡SIGUE! ►', 300, 70, P.y1, P.k0, 'r'); }
    if (this.bossPhase === 'won' && this.winT > 20) { const t2 = Math.min(1, (this.winT - 20) / 20); rect(ctx, 0, 70, Math.round(W * t2), 26, P.k0); hline(ctx, 0, 70, W, P.y0); hline(ctx, 0, 95, W, P.y0); if (this.winT > 40) text(ctx, '¡ÁREA SUPERADA!', 160, 79, this.winT % 20 < 10 ? P.y1 : P.k9, null, 'c'); }
    if (G.static > 0) drawStatic(ctx, 2200);
    if (G.dialog) G.dialog.draw(ctx);
    if (this.overT) { ctx.globalAlpha = Math.min(0.7, this.overT / 100); rect(ctx, 0, 0, W, H, P.k0); ctx.globalAlpha = 1; }
    if (this.paused) this.drawPause(ctx);
  },
  drawHUD(ctx) {
    const p = G.player;
    ctx.drawImage(hudIcon('ian'), 4, 3); rect(ctx, 3, 2, 18, 1, P.k0); rect(ctx, 3, 19, 18, 1, P.k0); rect(ctx, 3, 2, 1, 18, P.k0); rect(ctx, 20, 2, 1, 18, P.k0);
    text(ctx, 'IAN', 24, 3, P.k9, P.k0); text(ctx, '×' + G.lives, 44, 3, P.y1, P.k0);
    const hc = p.hp > 50 ? P.g3 : p.hp > 25 ? P.y0 : P.r3;
    bar(ctx, 24, 12, 72, 4, p.hp / p.maxHp, p.dispHp / p.maxHp, hc, p.hp <= 25 && G.t % 30 < 15);
    // energía en 3 segmentos
    rect(ctx, 23, 18, 56, 5, P.k0);
    for (let i = 0; i < 3; i++) { const f = clamp((p.en - i * 33.4) / 33.4, 0, 1); rect(ctx, 24 + i * 18, 19, 17, 3, P.k2); rect(ctx, 24 + i * 18, 19, Math.round(17 * f), 3, f >= 1 ? P.c3 : P.c1); if (f >= 1) hline(ctx, 24 + i * 18, 19, 17, P.c5); }
    text(ctx, String(G.score).padStart(7, '0'), 316, 3, P.k9, P.k0, 'r');
    text(ctx, AREAS[G.area].special ? AREAS[G.area].name : 'ÁREA ' + AREAS[G.area].num + '-' + (G.stage + 1), 316, 13, P.y1, P.k0, 'r');
    const bs = G.bosses.filter((b) => !b.remove);
    if (bs.length && this.bossPhase !== 'won') {
      rect(ctx, 0, 164, W, 16, P.k0);
      if (bs.length === 1 && G.bosses.length === 1) {
        const b = bs[0]; text(ctx, b.name, 8, 166, P.k9); bar(ctx, 8, 175, 304, 3, b.hp / b.maxHp, b.dispHp / b.maxHp, P.r3);
        if (b.id === 'fantasma') { vline(ctx, 8 + Math.round(304 / 3), 174, 5, P.k9); vline(ctx, 8 + Math.round(608 / 3), 174, 5, P.k9); }
      } else {
        G.bosses.forEach((b, i) => { const x = 8 + i * 156; text(ctx, b.name + (b.cmul < 1 && b.hp > 0 ? ' ¡FURIOSO!' : ''), x, 166, b.hp > 0 ? P.k9 : P.k4); bar(ctx, x, 175, 148, 3, b.hp / b.maxHp, b.dispHp / b.maxHp, P.r3); });
      }
    }
  },
  drawPause(ctx) {
    ctx.globalAlpha = 0.65; rect(ctx, 0, 0, W, H, P.k0); ctx.globalAlpha = 1;
    panel(ctx, 66, 28, 188, 128, P.k1);
    text(ctx, 'PAUSA', 160, 40, P.y1, null, 'c');
    ['CONTINUAR', 'SALIR AL TÍTULO'].forEach((s, i) => text(ctx, (this.pi === i ? '► ' : '  ') + s, 104, 58 + i * 12, this.pi === i ? P.k9 : P.k6));
    const lines = ['FLECHAS: MOVERSE', 'Z: SALTAR · ABAJO+Z: BAJAR', 'X: GOLPE (X X X = COMBO)', 'X EN EL AIRE: PATADA', 'ABAJO+X EN EL AIRE: PICADA', 'C: ESPECIAL · M: SILENCIO', 'ARRIBA JUNTO A IRMA: PISTA'];
    lines.forEach((s, i) => text(ctx, s, 160, 84 + i * 9, P.k7, null, 'c'));
  },
};
function bar(ctx, x, y, w, h, f, ghost, col, blink) {
  rect(ctx, x - 1, y - 1, w + 2, h + 2, P.k0); rect(ctx, x, y, w, h, P.k2);
  rect(ctx, x, y, Math.round(w * clamp(ghost, 0, 1)), h, P.k8);
  rect(ctx, x, y, Math.round(w * clamp(f, 0, 1)), h, blink ? P.k9 : col);
  hline(ctx, x, y, Math.round(w * clamp(f, 0, 1)), P.k9); ctx.globalAlpha = 0.5; hline(ctx, x, y, Math.round(w * clamp(f, 0, 1)), col); ctx.globalAlpha = 1;
}

// ------------------------------------------------------------- escena: Game Over
class GameOverScene {
  constructor() { this.t = 0; this.count = 9; this.done = false; }
  enter() { Music.play('gameover'); this.big = bigText('GAME OVER', 3, [P.r4, P.r3, P.r2, P.r1]); }
  update() {
    this.t++;
    if (this.done) return;
    if (this.t > 90 && this.t % 60 === 30) { this.count--; SFX.play('blip', 0.6); if (this.count < 0) { this.done = true; Game.go(new TitleScene()); return; } }
    if (this.t > 50 && Input.ok()) {
      this.done = true; SFX.play('confirm');
      G.lives = 3; G.score = Math.floor(G.score / 2); G.nextLife = Math.max(20000, Math.ceil((G.score + 1) / 20000) * 20000);
      Game.go(Play.at(G.area, G.stage, true));
    }
  }
  draw(ctx) {
    rect(ctx, 0, 0, W, H, P.k0);
    for (let i = 0; i < 6; i++) { ctx.globalAlpha = 0.08 * (6 - i); circ(ctx, 160, 90, 150 - i * 20, P.r0); } ctx.globalAlpha = 1;
    ctx.drawImage(this.big, Math.round(160 - this.big.width / 2), 40);
    drawChar(ctx, 'ian', 'down', 0, 160, 118, 1);
    text(ctx, '¿CONTINUAR?', 160, 128, P.k9, P.k0, 'c');
    if (this.count >= 0) text(ctx, String(this.count), 160, 140, P.y1, P.k0, 'c');
    if (this.t % 40 < 26) text(ctx, 'PULSA X O ENTER', 160, 158, P.k6, null, 'c');
  }
}

// ------------------------------------------------------------- escena: título
class TitleScene {
  constructor() { this.t = 0; this.menu = false; this.sel = 0; this.done = false; }
  enter() {
    Music.play('titulo');
    this.save = Save.get();
    this.l1 = bigText('LAS CRÓNICAS DE', 2, [P.k9, P.k8, P.k7, P.k6]);
    this.l2 = bigText('RENZO', 5, [P.y2, P.y1, P.y0, P.o3, P.o2, P.r3], P.k0, 2);
    if (!this.bg) { const [c, x] = mkCanvas(320, 180); nightSky(x); circ(x, 262, 34, 16, P.k8); circ(x, 262, 34, 14, P.y2); this.bg = c; }
    this.city = tileLayer('title_city', NIGHT_CITY);
  }
  items() {
    const it = [{ s: 'NUEVA PARTIDA', f: () => this.start(0) }];
    if ((this.save.area || 0) > 0 && this.save.area < AREAS.length) it.push({ s: 'CONTINUAR · ' + areaLabel(this.save.area), f: () => this.start(this.save.area) });
    it.push({ s: 'CONTROLES', f: () => Game.go(new ControlsScene()) });
    return it;
  }
  start(a) {
    this.done = true; G.score = 0; G.lives = 3; G.nextLife = 20000; G.player = null;
    Game.go(new StoryScene(AREAS[a].pre, () => Game.go(new CardScene(a, () => Game.go(Play.at(a, 0, true))))));
  }
  update() {
    this.t++;
    if (this.done) return;
    if (!this.menu) { if (this.t > 20 && (Input.ok() || Input.pressed.special)) { this.menu = true; SFX.play('confirm'); } return; }
    const it = this.items();
    if (Input.pressed.up) { this.sel = (this.sel + it.length - 1) % it.length; SFX.play('select'); }
    if (Input.pressed.down) { this.sel = (this.sel + 1) % it.length; SFX.play('select'); }
    if (Input.ok()) { SFX.play('confirm'); it[this.sel].f(); }
  }
  draw(ctx) {
    ctx.drawImage(this.bg, 0, 0);
    ctx.globalAlpha = 0.18 + Math.sin(this.t * 0.03) * 0.06; ctx.drawImage(ghostFace(this.t % 200 < 100 ? 'idle' : 'open'), 110, 22); ctx.globalAlpha = 1;
    const off = Math.floor(this.t * 0.25) % this.city.width;
    ctx.drawImage(this.city, -off, 30); ctx.drawImage(this.city, this.city.width - off, 30);
    rect(ctx, 0, 158, W, 22, P.k1); hline(ctx, 0, 158, W, P.k4); for (let x = 0; x < W; x += 16) vline(ctx, x + (this.t >> 3) % 16, 159, 21, P.k2);
    const ly = Math.round(Math.sin(this.t * 0.05) * 2);
    ctx.drawImage(this.l1, Math.round(160 - this.l1.width / 2), 14 + ly);
    ctx.drawImage(this.l2, Math.round(160 - this.l2.width / 2), 30 + ly);
    if (this.t % 90 < 6) { const sx = 120 + (this.t % 270) / 3; text(ctx, '★', sx, 40 + ly, P.k9); }
    drawChar(ctx, 'ian', 'idle', this.t * 0.05, 92, 158, 1);
    drawChar(ctx, 'puaj', 'stand', this.t * 0.05, 230, 158, -1);
    if (!this.menu) { if (this.t % 50 < 32) text(ctx, 'PULSA ENTER', 160, 112, P.k9, P.k0, 'c'); }
    else this.items().forEach((m, i) => { const s = this.sel === i; text(ctx, (s ? '► ' : '') + m.s + (s ? ' ◄' : ''), 160, 100 + i * 12, s ? P.y1 : P.k7, P.k0, 'c'); });
    text(ctx, 'FLECHAS · Z SALTAR · X GOLPE · C ESPECIAL', 160, 166, P.k6, null, 'c');
  }
}
class ControlsScene {
  constructor() { this.t = 0; }
  enter() {}
  update() { this.t++; if (this.t > 15 && (Input.ok() || Input.pressed.pause || Input.pressed.special)) Game.go(new TitleScene()); }
  draw(ctx) {
    rect(ctx, 0, 0, W, H, P.b0);
    panel(ctx, 8, 6, 304, 168, P.k1);
    text(ctx, 'CONTROLES', 160, 12, P.y1, null, 'c');
    const rows = [['FLECHAS', 'Moverse'], ['Z', 'Saltar'], ['ABAJO + Z', 'Bajar de una plataforma'], ['X', 'Golpe (X X X = combo)'], ['X EN EL AIRE', 'Patada voladora'],
      ['ABAJO + X (AIRE)', 'Patada en picada'], ['C', 'Especial (gasta energía)'], ['▲ JUNTO A IRMA', 'Pedir una pista'], ['ENTER / ESC', 'Pausa'], ['ESC EN DIÁLOGOS', 'Saltar escena'], ['M', 'Silenciar']];
    rows.forEach(([k, v], i) => { text(ctx, k, 20, 22 + i * 8.4, P.c4); text(ctx, v, 124, 22 + i * 8.4, P.k8); });
    text(ctx, 'OBJETOS', 160, 124, P.y1, null, 'c');
    const its = [['anticucho', '+25'], ['picarones', '+45'], ['ceviche', 'TODO'], ['chicha', 'ENERGÍA'], ['vida', '1 VIDA'], ['sol', 'PUNTOS']];
    its.forEach(([k, v], i) => { const x = 22 + i * 48; ctx.drawImage(sprItem(k), x, 134); text(ctx, v, x + 8, 150, P.k8, null, 'c'); });
    if (this.t % 40 < 26) text(ctx, 'PULSA X PARA VOLVER', 160, 163, P.k6, null, 'c');
  }
}

// ------------------------------------------------------------- escena: créditos
class CreditsScene {
  constructor() { this.t = 0; this.y = 116; this.done = false; this.parade = ['ian', 'puaj', 'renzo', 'kidfree', 'kidfree2', 'maton', 'guardia', 'garrote', 'ban', 'bif', 'apostol', 'surfista', 'granapostol', 'antimotin', 'elite', 'scotia', 'lechero', 'vendedor', 'pichincha'].map((id, i) => ({ id, x: 340 + i * 34 })); }
  enter() { Music.play('final'); this.art = storyArt('amanecer'); this.fin = bigText('FIN', 4, [P.y1, P.y0, P.o3, P.o2]); }
  update() {
    this.t++; this.y -= 0.42;
    for (const c of this.parade) { c.x -= 0.6; if (c.x < -20) c.x += this.parade.length * 34; }
    if (!this.done && this.t > 200 && (Input.ok() || Input.pressed.pause) && this.endY() < 60) { this.done = true; Game.go(new TitleScene()); }
    if (!this.done && Input.pressed.pause) { this.done = true; Game.go(new TitleScene()); }
  }
  endY() { return this.y + CREDITS.length * 13; }
  draw(ctx) {
    drawStageBack(ctx, this.art, 120, this.t, { w: 640 });
    ctx.globalAlpha = 0.4; rect(ctx, 0, 0, W, 120, P.k0); ctx.globalAlpha = 1;
    let y = this.y;
    for (const row of CREDITS) {
      if (y > 4 && y < 112) {
        if (row[0] === 'big') text(ctx, row[1], 160, y, P.y1, P.k0, 'c');
        if (row[0] === 'h') text(ctx, row[1], 160, y, P.c4, P.k0, 'c');
        if (row[0] === 'c') text(ctx, row[1], 160, y, P.k8, P.k0, 'c');
        if (row[0] === 'r') { text(ctx, row[1], 154, y, P.k9, P.k0, 'r'); text(ctx, row[2], 166, y, P.k7, P.k0); }
      }
      y += 13;
    }
    if (this.endY() < 60) { ctx.drawImage(this.fin, Math.round(160 - this.fin.width / 2), 50); if (this.t % 50 < 30) text(ctx, 'PULSA X', 160, 110, P.k8, P.k0, 'c'); }
    for (const c of this.parade) if (c.x > -20 && c.x < 340) drawChar(ctx, c.id, 'walk', this.t * 0.12, c.x, GROUND, -1);
  }
}

// ------------------------------------------------------------- arranque
setupTouch();
(function boot() {
  const qs = new URLSearchParams(location.search);
  if (qs.has('debug')) {
    window.RENZO = { G, Play, Game, AREAS, Music, SFX, Input, Save,
      go(a, s = 0) { G.score = 0; G.lives = 3; Game.go(Play.at(a, s, true)); },
      god(on = true) { G.god = on; }, power(m = 1) { G.dmgMul = m; },
      killAll() { for (const e of G.ents) if (e.isEnemy && !e.isBoss) { e.hp = 0; e.state = 'knock'; e.vy = -2; e.onGround = false; e.noGrav = false; } },
    };
  }
  Game.scene = new TitleScene(); Game.scene.enter();
  if (qs.has('debug') && qs.has('area')) window.RENZO.go(parseInt(qs.get('area'), 10) - 1, parseInt(qs.get('stage') || '1', 10) - 1);
  requestAnimationFrame(frame);
})();

</script>
